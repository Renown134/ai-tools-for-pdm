<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Кто выгуливает Бориса</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; background: #f5f2ec; color: #222; }
    .wrap { max-width: 640px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 1.4rem; margin: 8px 0 4px; }
    h2 { font-size: 1.05rem; margin: 0 0 8px; }
    .date { color: #555; margin: 0 0 20px; }
    .card { background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 12px 16px; margin-bottom: 20px; }
    ul.slots { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
    .slot { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 16px;
            background: #fff; border: 1px solid #ddd; border-radius: 10px; }
    .slot.free { border-left: 6px solid #2e7d32; }
    .slot.booked { border-left: 6px solid #9e9e9e; background: #efedea; color: #555; }
    .slot-time { font-weight: 700; font-size: 1.1rem; min-width: 60px; }
    .slot-name { font-weight: 600; }
    .slot-form, .feeding form { display: flex; flex-wrap: wrap; gap: 8px; flex: 1; margin: 0; }
    .slot-form input, .feeding input { flex: 1; min-width: 140px; padding: 8px;
            border: 1px solid #bbb; border-radius: 6px; font-size: 0.95rem; }
    button { padding: 8px 14px; border: 0; border-radius: 6px; background: #2e7d32;
            color: #fff; cursor: pointer; font-size: 0.95rem; }
    button:hover { background: #256428; }
    .message { color: #b3261e; min-height: 1.2em; margin: 8px 0 0; }
    .feeding-info { margin: 0 0 8px; }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Кто выгуливает Бориса?</h1>
    <p class="date" id="current-date">Загрузка…</p>

    <section class="card" aria-labelledby="slots-title">
      <h2 id="slots-title">Слоты прогулок на сегодня</h2>
      <ul class="slots" id="slots"></ul>
      <p class="message" id="slots-message" role="alert"></p>
    </section>

    <section class="card feeding" aria-labelledby="feeding-title">
      <h2 id="feeding-title">Последнее кормление</h2>
      <p class="feeding-info" id="feeding-info">Загрузка…</p>
      <form id="feeding-form">
        <label for="feeding-name" class="sr-only">ФИО</label>
        <input id="feeding-name" placeholder="Например, Илья Примеров" autocomplete="off">
        <button type="submit">Отметить кормление</button>
      </form>
      <p class="message" id="feeding-message" role="alert"></p>
    </section>
  </main>

  <script>
    'use strict';

    const $slots = document.getElementById('slots');
    const $slotsMessage = document.getElementById('slots-message');
    const $date = document.getElementById('current-date');
    const $feedingInfo = document.getElementById('feeding-info');
    const $feedingMessage = document.getElementById('feeding-message');

    function fmtDate(isoDay) {
      const [y, m, d] = isoDay.split('-').map(Number);
      return new Date(y, m - 1, d).toLocaleDateString('ru-RU', {
        day: 'numeric', month: 'long', year: 'numeric'
      });
    }

    function fmtTime(isoDateTime) {
      return new Date(isoDateTime).toLocaleString('ru-RU', {
        day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit'
      });
    }

    async function loadSlots() {
      const res = await fetch('/api/slots');
      const data = await res.json();
      $date.textContent = 'Сегодня: ' + fmtDate(data.walk_date);
      renderSlots(data.slots);
    }

    function renderSlots(slots) {
      $slots.innerHTML = '';
      for (const slot of slots) {
        const li = document.createElement('li');
        li.className = 'slot ' + (slot.booked_by ? 'booked' : 'free');

        const time = document.createElement('span');
        time.className = 'slot-time';
        time.textContent = slot.slot_time;
        li.appendChild(time);

        if (slot.booked_by) {
          // Занятый слот: показываем ФИО, действие записи не предлагаем
          const who = document.createElement('span');
          who.className = 'slot-name';
          who.textContent = slot.booked_by;
          li.appendChild(who);
        } else {
          // Свободный слот: ввод ФИО и подтверждение
          const form = document.createElement('form');
          form.className = 'slot-form';
          const input = document.createElement('input');
          input.type = 'text';
          input.required = true;
          input.autocomplete = 'off';
          input.placeholder = 'ФИО';
          input.setAttribute('aria-label', 'ФИО для слота ' + slot.slot_time);
          const btn = document.createElement('button');
          btn.type = 'submit';
          btn.textContent = 'Записаться';
          form.append(input, btn);
          form.addEventListener('submit', (e) => {
            e.preventDefault();
            book(slot.slot_time, input.value);
          });
          li.appendChild(form);
        }
        $slots.appendChild(li);
      }
    }

    async function book(slotTime, name) {
      $slotsMessage.textContent = '';
      const res = await fetch('/api/slots/book', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ slot_time: slotTime, name: name })
      });
      const data = await res.json();
      if (!res.ok) {
        // Понятный отказ сервера (занят, пустое ФИО и т.п.)
        $slotsMessage.textContent = data.error;
      }
      await loadSlots(); // перерисовать фактическое состояние из БД
    }

    async function loadFeeding() {
      const res = await fetch('/api/feedings/latest');
      const data = await res.json();
      if (data.feeding) {
        $feedingInfo.textContent =
          data.feeding.employee_name + ' — ' + fmtTime(data.feeding.fed_at);
      } else {
        $feedingInfo.textContent = 'Кормлений ещё не было.';
      }
    }

    document.getElementById('feeding-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('feeding-name');
      $feedingMessage.textContent = '';
      const res = await fetch('/api/feedings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: input.value })
      });
      const data = await res.json();
      if (res.ok) {
        input.value = '';
      } else {
        $feedingMessage.textContent = data.error;
      }
      await loadFeeding();
    });

    loadSlots();
    loadFeeding();
  </script>
</body>
</html>
